<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <main class="home">
      <header class="hero">
        <img
          class="hero-mascot"
          src="assets/animals/lion.png"
          alt=""
          width="120"
          height="120"
        />
        <h1>Games</h1>
        <p>Choose a game to play</p>
      </header>

      <nav class="game-list" aria-label="Games">
        <a class="game-card" href="games/match/">
          <img src="assets/animals/frog.png" alt="" width="88" height="88" />
          <span class="game-card-text">
            <span class="game-card-title">Right or Wrong?</span>
            <span class="game-card-blurb">
              Does the name match the picture? Tap Right or Wrong.
            </span>
          </span>
        </a>

        <a class="game-card" href="games/clues/">
          <img src="assets/animals/fox.png" alt="" width="88" height="88" />
          <span class="game-card-text">
            <span class="game-card-title">Clues</span>
            <span class="game-card-blurb">
              2 players — give clues before the timer runs out.
            </span>
          </span>
        </a>
      </nav>
    </main>
  </body>
</html>
