<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clues</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <main class="app">
      <header class="top-bar">
        <p class="brand">
          <a class="home-link" href="../../">Games</a>
          <span class="brand-sep" aria-hidden="true">·</span>
          Clues
        </p>
        <div class="stats" id="statsBar" hidden>
          <p class="timer">Time: <span id="timerValue">60</span>s</p>
          <p class="score">Score: <span id="scoreValue">0</span></p>
        </div>
      </header>

      <section class="screen" id="categoryScreen">
        <h1 class="title">Pick a category</h1>
        <p class="subtitle">
          Player 1 looks at the screen and gives clues. Player 2 looks away and
          guesses.
        </p>
        <div class="category-list" id="categoryList"></div>
      </section>

      <section class="screen" id="playScreen" hidden>
        <div class="card">
          <div class="item-stage">
            <img
              id="itemImage"
              class="item-image"
              alt=""
              width="240"
              height="240"
            />
          </div>
          <p class="prompt">Give clues for…</p>
          <p class="item-name" id="itemName"></p>
          <div class="actions">
            <button type="button" class="btn btn-right" id="successBtn">
              Got it!
            </button>
            <button type="button" class="btn btn-skip" id="skipBtn">
              Skip
            </button>
          </div>
        </div>
      </section>

      <section class="screen" id="resultsScreen" hidden>
        <h1 class="title">Time’s up!</h1>
        <p class="final-score" id="finalScore"></p>
        <p class="subtitle" id="finalMessage"></p>
        <button type="button" class="btn btn-primary" id="playAgainBtn">
          Play Again
        </button>
        <button type="button" class="btn btn-secondary" id="changeCategoryBtn">
          Change Category
        </button>
      </section>
    </main>

    <script src="../../shared/js/categories.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
