<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7ec8e3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maze" />
    <title>Maze</title>
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <main class="app app-maze">
      <header class="top-bar">
        <p class="brand">
          <a class="home-link" href="../../">Games</a>
          <span class="brand-sep" aria-hidden="true">·</span>
          Maze
        </p>
      </header>

      <section class="screen" id="startScreen">
        <h1 class="title">Maze Explorer</h1>
        <p class="subtitle">
          Move through the maze in first person. Meet animal friends and find
          the glowing exit!
        </p>
        <button type="button" class="btn btn-primary" id="startBtn">
          Start
        </button>
      </section>

      <section class="screen screen-play" id="playScreen" hidden>
        <div class="viewport-wrap">
          <canvas id="view" width="960" height="640" aria-label="Maze view"></canvas>
          <p class="hint" id="hint">Find the green exit — say hi to animals on the way!</p>
        </div>

        <div class="controls" aria-label="Movement controls">
          <button type="button" class="ctrl" id="turnLeft" aria-label="Turn left">◀</button>
          <button type="button" class="ctrl ctrl-forward" id="moveForward" aria-label="Move forward">▲</button>
          <button type="button" class="ctrl" id="turnRight" aria-label="Turn right">▶</button>
          <button type="button" class="ctrl ctrl-back" id="moveBack" aria-label="Move back">▼</button>
        </div>
      </section>

      <section class="screen" id="resultsScreen" hidden>
        <h1 class="title">You found the exit!</h1>
        <p class="subtitle">Nice exploring — ready for another go?</p>
        <button type="button" class="btn btn-primary" id="playAgainBtn">
          Play Again
        </button>
      </section>
    </main>

    <script src="js/game.js"></script>
  </body>
</html>
